 action_not_endorsed_by_realm_priest_desc:0 "Euer [recipient.GetCouncilTitle] [recipient.GetUIName] billigt Euch nicht.\n\n#help Ihr solltet dafür sorgen, dass [recipient.Custom('DE_PRO_PER_S_3P_N')] eine #P positive#! [opinion|E] von Euch hat, da [recipient.Custom('DE_PRO_PER_S_3P_N')] Euch ansonsten keine [levies|E] oder [taxes|E] zukommen lässt! Der beste Weg, dies zu erreichen, ist die Verwendung des [Concept('scheme', 'Komplotts')|E] „[GetScheme('sway').GetTypeName]“.\n\nSinkt [recipient.Custom('DE_PRO_POS_S_3P')]e Meinung von Euch auf #N -10#! oder weniger, könnte [recipient.Custom('DE_PRO_PER_S_3P_N')] sich sogar in Eure Angelegenheiten einmischen.#!"
