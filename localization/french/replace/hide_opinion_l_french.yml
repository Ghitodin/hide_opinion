 action_not_endorsed_by_realm_priest_desc:0 "Votre [recipient.GetCouncilTitle|l] ([recipient.GetUIName]) ne vous approuve pas.\n\n#help Vous devriez vous assurer que son opinion à votre égard soit #P positive#!, autrement, il ne vous fournira ni [levies|El] ni [taxes|El] ! La meilleure façon d’y remédier est d’utiliser le [scheme|El] visant à [GetScheme('sway').GetActionName|l].\n\nSi son opinion envers vous est égale ou inférieure à #N -10#!, il pourrait commencer à interférer dans vos affaires.#!"
