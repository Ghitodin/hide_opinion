 action_not_endorsed_by_realm_priest_desc:0 "당신의 [recipient.GetCouncilTitle]인 [recipient.GetUIName](이)가 당신을 지지하지 않습니다.\n\n#help 대상이 당신을 향해 #P 긍정적#!인 [opinion|E]을 갖게 하십시오. 그렇지 않으면 [taxes|E]이나 [levies|E]을 전혀 제공하지 않을 것입니다! 의견을 개선하는 제일 좋은 방법은 [GetScheme('sway').GetTypeName] [scheme|E]을 사용하는 것입니다.\n\n만약 당신을 향한 [recipient.GetHerHis] 의견이 #N -10#! 이하로 떨어진다면, 당신의 일을 방해하기 시작할지도 모릅니다.#!"
